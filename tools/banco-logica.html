<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>banco di prova — logica</title></head>
<body><pre id="out">running</pre>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"}}
</script>
<script type="module">
const log=[];const ok=(m)=>log.push('OK   '+m);const bad=(m)=>log.push('FAIL '+m);
window.onerror=e=>{log.push('ERROR '+e);document.getElementById('out').textContent=log.join('\n');};
try{
  const T=await import('../js/music/theory.js');
  const R=await import('../js/pose/rays.js');
  const S=await import('../js/sequence.js');
  await import('../js/fps.js');
  await import('../js/music/synth.js');
  await import('../js/render/stage.js');
  await import('../js/render/raysView.js');
  await import('../js/render/glowBody.js');
  await import('../js/render/avatar.js');
  await import('../js/render/hud.js');
  await import('../js/pose/tracker.js');
  await import('../js/intro.js');
  ok('tutti i moduli importati');

  const data = await (await fetch('../data/asanas.json')).json();
  ok('asanas.json: '+data.asanas.length+' asana');

  const p = new S.Practice(data,{mode:'sequence',sequenceId:'surya-namaskara-a'});
  const rows=[];
  for(let i=0;i<13;i++){p.advance();rows.push((i+1)+' '+p.current.name+' -> '+p.chord.symbol+' ['+p.chord.notes.map(n=>n.name).join(' ')+'] rette='+p.rays.map(r=>r.id).join(','));}
  log.push(rows.join('\n'));

  // La posa guida arriva al telefono normalizzata sul bacino, e il
  // telefono la rimette in scala per conto suo. Qui si controlla che la
  // figura che disegnera' finisca esattamente dove la mette il computer:
  // se le due aritmetiche si allontanano, sul telefono la guida risulta
  // fuori posto e nessuno se ne accorge guardando il computer.
  const Sc = await import('../js/schermo.js');
  await new Promise((ris, no) => {
    const t = document.createElement('script');
    t.src = '../js/schermoView.js';
    t.onload = ris; t.onerror = () => no(new Error('schermoView.js non caricato'));
    document.head.appendChild(t);
  });

  const pv = new S.Practice(data,{mode:'sequence',sequenceId:'surya-namaskara-a'});
  pv.advance(); pv.advance();          // Urdhva Hastasana: braccia in alto

  // un corpo finto qualunque, purche' con bacino e spalle
  const corpo = R.addMidpoints({
    lShoulder:{x:0.62,y:0.33,conf:1}, rShoulder:{x:0.66,y:0.33,conf:1},
    lHip:{x:0.63,y:0.52,conf:1},      rHip:{x:0.67,y:0.52,conf:1},
    lKnee:{x:0.63,y:0.70,conf:1},     rKnee:{x:0.67,y:0.70,conf:1},
    lAnkle:{x:0.63,y:0.88,conf:1},    rAnkle:{x:0.67,y:0.88,conf:1},
    lElbow:{x:0.62,y:0.42,conf:1},    rElbow:{x:0.66,y:0.42,conf:1},
    lWrist:{x:0.62,y:0.50,conf:1},    rWrist:{x:0.66,y:0.50,conf:1},
    nose:{x:0.645,y:0.27,conf:1}
  });

  const atteso = R.anchorTarget(pv.targetPts, corpo, 1.3333);
  const messaggio = Sc.Schermo.snapshot({
    practice: pv,
    res: { scores: pv.rays.map(() => 0), active: pv.rays.map(() => false), mirrored: false },
    uPts: corpo, fits: pv.rays.map(() => null), targetPts: pv.targetPts,
    aspect: 1.3333, progress: 0, state: 'matching', audio: null, maxHarmonics: 8
  });

  if (!messaggio.target) {
    bad('il messaggio per il telefono non contiene la posa guida');
  } else {
    const vista = new window.SchermoView(document.createElement('canvas'));
    vista._keepTarget(messaggio);
    const ottenuto = vista._anchorTarget(messaggio);
    let peggio = 0, dove = '';
    for (const k in atteso) {
      if (!ottenuto[k]) { peggio = 9; dove = k + ' manca'; break; }
      const e = Math.max(Math.abs(atteso[k].x - ottenuto[k][0]),
                         Math.abs(atteso[k].y - ottenuto[k][1]));
      if (e > peggio) { peggio = e; dove = k; }
    }
    // 1e-4 e' la precisione con cui i numeri viaggiano (r4 in js/schermo.js)
    if (peggio < 2e-4) ok('la guida sul telefono cade dove la mette il computer (scarto max ' + peggio.toFixed(6) + ')');
    else bad('guida fuori posto di ' + peggio.toFixed(4) + ' su ' + dove);
  }

  // "ricomincia": deve tornare al primo passo E alla tonalita' di partenza,
  // non riprendere il circolo delle quinte da dove era arrivato
  const pr = new S.Practice(data,{mode:'sequence',sequenceId:'surya-namaskara-a'});
  pr.advance(); const primo = pr.current.id + ' ' + pr.chord.symbol;
  for(let i=0;i<5;i++) pr.advance();
  pr.reset(); pr.advance();
  const dopo = pr.current.id + ' ' + pr.chord.symbol;
  if(dopo===primo) ok('reset() riparte da '+primo);
  else bad('reset(): mi aspettavo '+primo+', ho avuto '+dopo);

  // ordine note: spina, arti sup, arti inf, extra
  p.stepIndex=-1;p.changeCount=-1;p.advance();
  if(p.rays[0].id==='spine') ok('1a nota = spina dorsale'); else bad('1a nota = '+p.rays[0].id);
  const utt=data.asanas.find(a=>a.id==='uttanasana');
  const ur=R.buildAsanaRays(utt,data.rayLibrary);
  log.push('uttanasana rette ordinate: '+ur.map(r=>r.id).join(' > '));

  // il corpo nella posa esatta deve dare punteggio pieno su tutte le rette
  for(const a of data.asanas){
    const t=R.asanaPoints(a);
    const rays=R.buildAsanaRays(a,data.rayLibrary);
    const sc=rays.map(r=>R.rayScore(r,t,t).score.toFixed(2));
    log.push('  '+a.id.padEnd(24)+' '+rays.map((r,i)=>r.id+'='+sc[i]).join(' '));
  }

  // uno scostamento evidente deve abbassare il punteggio
  const tad=data.asanas.find(a=>a.id==='tadasana');
  const tp=R.asanaPoints(tad);
  const bent=JSON.parse(JSON.stringify(tp));
  bent.lKnee.x+=0.18;bent.rKnee.x+=0.18;
  const legs=R.buildAsanaRays(tad,data.rayLibrary).find(r=>r.id==='legs');
  const sGood=R.rayScore(legs,tp,tp).score, sBad=R.rayScore(legs,R.addMidpoints(bent),tp).score;
  log.push('tadasana gambe: dritte='+sGood.toFixed(2)+'  piegate='+sBad.toFixed(2));
  if(sBad<sGood-0.25) ok('il punteggio scende con la posa sbagliata'); else bad('punteggio poco sensibile');

  // ── inquadratura: zoom e messa a fuoco ──────────────────────────────
  const { Stage, MAX_ZOOM } = await import('../js/render/stage.js?v='+Date.now());
  const box=document.createElement('div'); box.style.cssText='position:fixed;width:1px;height:1px;opacity:0'; document.body.appendChild(box);
  const vid=document.createElement('video'); Object.defineProperty(vid,'videoWidth',{value:1280}); Object.defineProperty(vid,'videoHeight',{value:960});
  const st=new Stage(box,vid);
  st.resize();
  const A=st.viewport.aspect;
  log.push('aspetto video '+A.toFixed(3)+'  riquadro base '+st.baseW.toFixed(3)+' x '+st.baseH.toFixed(3));

  st.setView(1);
  let v=st.viewBox;
  const contains = v.cx-v.w/2<=1e-6 && v.cx+v.w/2>=A-1e-6 && v.cy-v.h/2<=1e-6 && v.cy+v.h/2>=1-1e-6;
  contains ? ok('a zoom 1 si vede tutto il fotogramma') : bad('a zoom 1 il fotogramma viene tagliato: '+JSON.stringify(v));

  // messa a fuoco spinta fuori: il riquadro deve restare dentro l'immagine
  st.setView(2.2, -5, -5);
  v=st.viewBox;
  const inside = v.cx-v.w/2>=-1e-6 && v.cx+v.w/2<=A+1e-6 && v.cy-v.h/2>=-1e-6 && v.cy+v.h/2<=1+1e-6;
  inside ? ok('ingrandendo il riquadro resta dentro il fotogramma') : bad('riquadro fuori dal fotogramma: '+JSON.stringify(v));

  // zoom oltre il massimo e sotto 1 vengono limitati
  st.setView(99); const zHi=st.zoom; st.setView(0.1); const zLo=st.zoom;
  (zHi===MAX_ZOOM && zLo===1) ? ok('zoom limitato fra 1 e '+MAX_ZOOM) : bad('zoom non limitato: '+zHi+' / '+zLo);

  // un corpo alto un terzo dello schermo deve far salire lo zoom
  const fill=0.82, bh=0.33, bw=0.12;
  const z=Math.max(1,Math.min(MAX_ZOOM,Math.min((st.baseW*fill)/bw,(st.baseH*fill)/bh)));
  log.push('corpo alto '+bh+' del fotogramma -> zoom automatico '+z.toFixed(2)+'x');
  z>1.5 ? ok('da lontano lo zoom automatico interviene') : bad('zoom automatico troppo timido: '+z.toFixed(2));

}catch(e){bad(e&&e.stack||e);}
document.getElementById('out').textContent=log.join('\n');
</script></body></html>
