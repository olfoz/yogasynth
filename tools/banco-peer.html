<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>banco di prova — collegamento diretto</title>
<style>
    body { font: 13px/1.6 ui-monospace, Menlo, monospace; background: #0b0d16; color: #ddd; margin: 0; padding: 16px; }
    pre { white-space: pre-wrap; }
    .ok { color: #7fe08a; }
    .no { color: #ff9a9a; }
</style>
</head>
<body>
<pre id="o">avvio…</pre>
<script type="module">
/*
 * Prova il collegamento diretto per davvero: apre nella stessa pagina un
 * lato "computer" (PeerHost) e un lato "telefono" (un peer che si collega
 * col codice), e verifica che uno stato mandato dal primo arrivi al secondo.
 *
 * I due peer stanno nello stesso browser, ma il percorso e' quello vero:
 * presentazioni dal broker pubblico, dati su un canale WebRTC diretto.
 * Serve internet.
 *
 *   chrome --headless=new --virtual-time-budget=40000 --dump-dom
 *          http://127.0.0.1:8941/tools/banco-peer.html
 */
const L = [];
const out = () => { document.getElementById('o').innerHTML = L.join('\n'); };
const dire = m => { L.push(m); out(); };
const ok = m => { L.push('<span class="ok">OK  </span> ' + m); out(); };
const no = m => { L.push('<span class="no">FAIL</span> ' + m); out(); };

const t0 = performance.now();
const ms = () => (performance.now() - t0).toFixed(0) + 'ms';

try {
    const { PeerHost, caricaPeerJS, nuovoCodice } = await import('/js/peer.js?v=' + Date.now());

    dire('scarico PeerJS dal CDN...');
    await caricaPeerJS();
    ok('PeerJS caricato (' + ms() + ')');

    // lato computer
    const codice = nuovoCodice();
    dire('codice generato: ' + codice);
    const host = new PeerHost((testo, dettaglio) => {
        dire('  [computer] ' + testo + (dettaglio ? ' — ' + dettaglio : ''));
    });
    const dato = await host.start(codice);
    if (dato !== codice) { dire('  (il codice era occupato, ora e: ' + dato + ')'); }

    // aspetta che il broker abbia registrato il lato computer
    await new Promise(r => {
        if (host.peer && host.peer.open) { r(); return; }
        host.peer.on('open', r);
        setTimeout(r, 8000);
    });
    ok('lato computer registrato sul broker (' + ms() + ')');

    // lato telefono
    dire('il telefono si collega con il codice...');
    const ricevuti = [];
    const telefono = new window.Peer(null, { debug: 0 });
    const telefonoPronto = await new Promise(r => {
        telefono.on('open', () => r(true));
        telefono.on('error', () => r(false));
        setTimeout(() => r(false), 10000);   // senza limite, qui si resta appesi per sempre
    });
    if (!telefonoPronto) {
        no('il lato telefono non si registra sul broker entro 10s');
        no('prova tools/banco-rete.html nel browser vero: WebRTC o WebSocket sono bloccati');
        throw new Error('broker irraggiungibile');
    }

    const conn = telefono.connect('yogasynth-' + host.codice, {
        reliable: false, serialization: 'json'
    });
    conn.on('data', d => ricevuti.push(d));

    const aperto = await new Promise(r => {
        conn.on('open', () => r(true));
        conn.on('error', () => r(false));
        setTimeout(() => r(false), 12000);
    });
    aperto ? ok('canale diretto aperto (' + ms() + ')') : no('canale non aperto entro 12s');

    if (aperto) {
        // stesso pacchetto che manda l'app
        const snap = {
            t: Date.now(),
            aspect: 1.3333, asana: 'Uttanasana', chord: 'Dsus2',
            step: 'Passo 3/11', progress: 0.62, done: false,
            body: { nose: [0.556, 0.802], lHip: [0.5, 0.52], rHip: [0.52, 0.52] },
            rays: [{ id: 'spine', color: '#7C4DFF', note: 'D2', segs: [['hipMid', 'nose']],
                     score: 0.93, active: true, harmonics: 5,
                     fit: { cx: 0.537, cy: 0.67, dx: 0.155, dy: 0.988 } }]
        };
        const peso = JSON.stringify(snap).length;

        for (let i = 0; i < 5; i++) {
            snap.t = Date.now();
            snap.progress = 0.1 * i;
            host.send(snap);
            await new Promise(r => setTimeout(r, 120));
        }
        await new Promise(r => setTimeout(r, 900));

        if (ricevuti.length >= 4) {
            ok("ricevuti " + ricevuti.length + " aggiornamenti su 5 (" + peso + " byte l'uno)");
        } else {
            no('ricevuti solo ' + ricevuti.length + ' aggiornamenti su 5');
        }
        let fuoriOrdine = 0;
        for (let i = 1; i < ricevuti.length; i++) {
            if (ricevuti[i].t < ricevuti[i - 1].t) fuoriOrdine++;
        }
        fuoriOrdine
            ? dire('  (' + fuoriOrdine + ' arrivati fuori ordine: la marca temporale li scarta)')
            : ok('arrivati in ordine');

        const ultimo = ricevuti[ricevuti.length - 1];
        if (ultimo && ultimo.asana === 'Uttanasana' && ultimo.rays && ultimo.rays.length === 1) {
            ok('il contenuto arriva intatto: ' + ultimo.asana + ' / ' + ultimo.chord
               + ' / retta ' + ultimo.rays[0].id);
        } else {
            no('contenuto alterato: ' + JSON.stringify(ultimo).slice(0, 120));
        }
    }

    host.stop();
    telefono.destroy();
    dire('FINE (' + ms() + ')');
} catch (e) {
    no((e && e.stack) || String(e));
}
</script>
</body>
</html>
