<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>banco di prova — collegamento diretto</title>
<style>
    body { font: 13px/1.6 ui-monospace, Menlo, monospace; background: #0b0d16; color: #ddd; margin: 0; padding: 16px; }
    pre { white-space: pre-wrap; }
    .ok { color: #7fe08a; }
    .no { color: #ff9a9a; }
</style>
<script>
/*
 * Si ricarica una volta sola con un parametro unico nell'indirizzo.
 *
 * GitHub Pages manda Cache-Control: max-age=600, quindi dopo un
 * aggiornamento il browser continua a mostrare la pagina vecchia per dieci
 * minuti e si finisce per leggere il risultato di una versione che non
 * esiste piu'. Un indirizzo mai visto non e' in cache: arriva fresco.
 */
if (!/[?&]v=/.test(location.search)) {
    // si CONSERVA quello che c'era gia' nell'indirizzo: con location.pathname
    // da solo, aprire "...?relay=1" faceva rimbalzare su "...?v=123" e il
    // relay=1 spariva per strada, in silenzio
    var sep = location.search ? '&' : '?';
    location.replace(location.pathname + location.search + sep + 'v=' + Date.now() + location.hash);
}
</script>
</head>
<body>
<pre id="o">avvio…</pre>
<script type="module">
/*
 * Prova il collegamento diretto per davvero: apre nella stessa pagina un
 * lato "computer" (PeerHost) e un lato "telefono" (un peer che si collega
 * col codice), e verifica che uno stato mandato dal primo arrivi al secondo.
 *
 * I due peer stanno nello stesso browser, ma il percorso e' quello vero:
 * presentazioni dal broker pubblico, dati su un canale WebRTC diretto.
 * Serve internet.
 *
 * Due modalita':
 *   banco-peer.html           strada qualunque: se i due si vedono
 *                             direttamente, il TURN non viene nemmeno usato
 *   banco-peer.html?relay=1   FORZA il passaggio dal TURN
 *                             (iceTransportPolicy: 'relay')
 *
 * La seconda e' quella che conta per una dimostrazione fuori casa: se
 * funziona li', funziona ovunque, perche' quella e' la via di scorta. E
 * misurando il tempo di andata e ritorno si capisce quanto costa in
 * latenza — utile per scegliere fra un piano TURN e un altro.
 */
const L = [];
const out = () => { document.getElementById('o').innerHTML = L.join('\n'); };
const dire = m => { L.push(m); out(); };
const ok = m => { L.push('<span class="ok">OK  </span> ' + m); out(); };
const no = m => { L.push('<span class="no">FAIL</span> ' + m); out(); };

const t0 = performance.now();
const ms = () => (performance.now() - t0).toFixed(0) + 'ms';

try {
    const { PeerHost, caricaPeerJS, nuovoCodice, caricaIce } = await import('../js/peer.js?v=' + Date.now());

    const soloRelay = /[?&]relay=1/.test(location.search);
    const ice = await caricaIce();
    const conTurn = ice.iceServers.some(s => String(s.urls).indexOf('turn:') === 0);
    dire(soloRelay
        ? "modalita RELAY: obbligo il passaggio dal TURN"
        : "modalita normale: si prende la strada che c'e' (aggiungi ?relay=1 per forzare il TURN)");
    if (soloRelay && !conTurn) {
        no("nessun TURN in data/ice.json: in modalita relay non puo' funzionare");
        throw new Error('TURN mancante');
    }
    const config = soloRelay
        ? { iceServers: ice.iceServers, iceTransportPolicy: 'relay' }
        : ice;

    dire('scarico PeerJS dal CDN...');
    await caricaPeerJS();
    ok('PeerJS caricato (' + ms() + ')');

    // lato computer
    const codice = nuovoCodice();
    dire('codice generato: ' + codice);
    const host = new PeerHost((testo, dettaglio) => {
        dire('  [computer] ' + testo + (dettaglio ? ' — ' + dettaglio : ''));
    });
    const dato = await host.start(codice);
    // stessa politica anche dal lato computer, altrimenti uno dei due
    // potrebbe ancora prendere una scorciatoia diretta
    if (soloRelay && host.peer) { host.peer.options.config = config; }
    if (dato !== codice) { dire('  (il codice era occupato, ora e: ' + dato + ')'); }

    // aspetta che il broker abbia registrato il lato computer
    await new Promise(r => {
        if (host.peer && host.peer.open) { r(); return; }
        host.peer.on('open', r);
        setTimeout(r, 8000);
    });
    ok('lato computer registrato sul broker (' + ms() + ')');

    // lato telefono
    dire('il telefono si collega con il codice...');
    const ricevuti = [];
    const telefono = new window.Peer(null, { debug: 0, config: config });
    const telefonoPronto = await new Promise(r => {
        telefono.on('open', () => r(true));
        telefono.on('error', () => r(false));
        setTimeout(() => r(false), 10000);   // senza limite, qui si resta appesi per sempre
    });
    if (!telefonoPronto) {
        no('il lato telefono non si registra sul broker entro 10s');
        no('prova tools/banco-rete.html nel browser vero: WebRTC o WebSocket sono bloccati');
        throw new Error('broker irraggiungibile');
    }

    const conn = telefono.connect('yogasynth-' + host.codice, {
        reliable: false, serialization: 'json'
    });
    conn.on('data', d => ricevuti.push(d));

    const aperto = await new Promise(r => {
        conn.on('open', () => r(true));
        conn.on('error', () => r(false));
        setTimeout(() => r(false), 12000);
    });
    aperto ? ok('canale diretto aperto (' + ms() + ')') : no('canale non aperto entro 12s');

    if (aperto) {
        // stesso pacchetto che manda l'app
        const snap = {
            t: Date.now(),
            aspect: 1.3333, asana: 'Uttanasana', chord: 'Dsus2',
            step: 'Passo 3/11', progress: 0.62, done: false,
            body: { nose: [0.556, 0.802], lHip: [0.5, 0.52], rHip: [0.52, 0.52] },
            rays: [{ id: 'spine', color: '#7C4DFF', note: 'D2', segs: [['hipMid', 'nose']],
                     score: 0.93, active: true, harmonics: 5,
                     fit: { cx: 0.537, cy: 0.67, dx: 0.155, dy: 0.988 } }]
        };
        const peso = JSON.stringify(snap).length;

        for (let i = 0; i < 5; i++) {
            snap.t = Date.now();
            snap.progress = 0.1 * i;
            host.send(snap);
            await new Promise(r => setTimeout(r, 120));
        }
        await new Promise(r => setTimeout(r, 900));

        if (ricevuti.length >= 4) {
            ok("ricevuti " + ricevuti.length + " aggiornamenti su 5 (" + peso + " byte l'uno)");
        } else {
            no('ricevuti solo ' + ricevuti.length + ' aggiornamenti su 5');
        }
        let fuoriOrdine = 0;
        for (let i = 1; i < ricevuti.length; i++) {
            if (ricevuti[i].t < ricevuti[i - 1].t) fuoriOrdine++;
        }
        fuoriOrdine
            ? dire('  (' + fuoriOrdine + ' arrivati fuori ordine: la marca temporale li scarta)')
            : ok('arrivati in ordine');

        const ultimo = ricevuti[ricevuti.length - 1];
        if (ultimo && ultimo.asana === 'Uttanasana' && ultimo.rays && ultimo.rays.length === 1) {
            ok('il contenuto arriva intatto: ' + ultimo.asana + ' / ' + ultimo.chord
               + ' / retta ' + ultimo.rays[0].id);
        } else {
            no('contenuto alterato: ' + JSON.stringify(ultimo).slice(0, 120));
        }
    }

    // --- quanto ci mette un messaggio ad andare e tornare -------------
    if (aperto) {
        conn.on('data', d => { if (d && d.ping) { conn.send({ pong: d.ping }); } });
        const canale = host.connessioni[0];
        if (canale) {
            const tempi = [];
            canale.on('data', d => {
                if (d && d.pong) { tempi.push(performance.now() - d.pong); }
            });
            for (let i = 0; i < 10; i++) {
                canale.send({ ping: performance.now() });
                await new Promise(r => setTimeout(r, 150));
            }
            await new Promise(r => setTimeout(r, 600));
            if (tempi.length) {
                tempi.sort((a, b) => a - b);
                const mediana = tempi[Math.floor(tempi.length / 2)];
                ok('andata e ritorno: ' + mediana.toFixed(0) + ' ms (mediana su '
                   + tempi.length + '), sola andata circa ' + (mediana / 2).toFixed(0) + ' ms');
            } else {
                no('nessuna risposta al ping: non riesco a misurare il ritardo');
            }
        }
    }

    host.stop();
    telefono.destroy();
    dire('FINE (' + ms() + ')');
} catch (e) {
    no((e && e.stack) || String(e));
}
</script>
</body>
</html>
