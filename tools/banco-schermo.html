<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>banco di prova — schermo del telefono</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #05060b; color: #e9ecf5; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas { position: absolute; top: 0; left: 0; display: block; }
    .bar { position: absolute; left: 0; right: 0; padding: 12px 18px; pointer-events: none; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    #asana { font-size: 5.4vmin; font-weight: 700; }
    #chord {
        display: inline-block;
        font-size: 4.2vmin; font-weight: 700; color: #cbb6ff;
        margin-top: 2px;
    }
    #step  { font-size: 3vmin; color: #8b93ad; margin-top: 2px; }
    #cue   { font-size: 3.2vmin; color: #cfd5e6; line-height: 1.35; }
    #notes { margin-bottom: 8px; }
    .note {
        display: inline-block; font-size: 3.4vmin; font-weight: 700;
        padding: 3px 12px; margin: 0 6px 6px 0; border-radius: 999px;
        border: 2px solid currentColor; opacity: 0.3;
    }
    .note.on { opacity: 1; }
</style>
</head>
<body>
    <canvas id="sky"></canvas>
    <div class="bar top">
        <div id="asana">&mdash;</div>
        <div id="chord"></div>
        <div id="step"></div>
    </div>
    <div class="bar bottom">
        <div id="notes"></div>
        <div id="cue"></div>
    </div>

<script src="../js/schermoView.js"></script>
<script>
/*
 * Disegna una posa finta con SchermoView, senza rete.
 *
 * Esiste perche' schermo.html tiene sempre una richiesta appesa al server, e
 * una pagina che aspetta la rete Chrome headless non la fotografa mai: il
 * disegno va provato staccato dal trasporto.
 *
 *   chrome --headless=new --enable-unsafe-swiftshader --virtual-time-budget=8000
 *          --window-size=430,880 --screenshot=tel.png
 *          http://127.0.0.1:8941/tools/banco-schermo.html
 */
var SNAP = {
    aspect: 1.3333,
    asana: 'Urdhva Hastasana',
    step: 'Passo 2/11 · Urdhva Hastasana',
    cue: "Le braccia prolungano la spina dorsale verso l'alto: un unico raggio dai talloni alle dita.",
    chord: 'G',
    progress: 0.24,
    done: false,
    // Corpo ancora in Tadasana, braccia lungo i fianchi, mentre l'asana
    // chiesto e' Urdhva Hastasana: e' il caso che conta, quello in cui la
    // figura guida serve davvero. Con un corpo gia' nella posa giusta le
    // due sagome coinciderebbero e il banco non proverebbe niente. Le
    // coordinate vengono da data/asanas.json, non sono inventate: se le
    // proporzioni fossero sbagliate la figura guida sembrerebbe scalata
    // male e non si capirebbe di chi e' la colpa.
    body: {
        nose: [0.515, 0.260],
        lShoulder: [0.503, 0.326], rShoulder: [0.517, 0.326],
        lElbow: [0.501, 0.406], rElbow: [0.514, 0.406],
        lWrist: [0.501, 0.483], rWrist: [0.514, 0.483],
        lHip: [0.503, 0.500], rHip: [0.517, 0.500],
        lKnee: [0.503, 0.633], rKnee: [0.517, 0.633],
        lAnkle: [0.503, 0.759], rAnkle: [0.517, 0.759],
        shoulderMid: [0.510, 0.326], hipMid: [0.510, 0.500]
    },
    // la posa da raggiungere, come la manda js/schermo.js: relativa al
    // bacino e misurata in lunghezze di busto
    targetKey: 'urdhva-hastasana',
    target: {
        nose: [0.0049, -1.3766],
        lShoulder: [-0.0725, -0.9994], rShoulder: [0.003, -0.9994],
        lElbow: [-0.0245, -1.457], rElbow: [0.051, -1.457],
        lWrist: [-0.0091, -1.9021], rWrist: [0.0665, -1.9021],
        lHip: [-0.0378, 0.0], rHip: [0.0378, 0.0],
        lKnee: [-0.0378, 0.7661], rKnee: [0.0378, 0.7661],
        lAnkle: [-0.0378, 1.4898], rAnkle: [0.0378, 1.4898],
        shoulderMid: [-0.0347, -0.9994], hipMid: [0.0, 0.0]
    },
    rays: [
        { id: 'spine', label: 'Spina dorsale', color: '#7C4DFF', note: 'G2',
          segs: [['hipMid', 'shoulderMid'], ['shoulderMid', 'nose']],
          score: 0.88, active: true, harmonics: 3, maxHarmonics: 8,
          fit: { cx: 0.5083, cy: 0.3622, dx: 0.0043, dy: 1.0 } },
        { id: 'arms', label: 'Arti superiori', color: '#00E5FF', note: 'B3',
          segs: [['lWrist', 'lElbow'], ['lElbow', 'lShoulder'], ['lShoulder', 'rShoulder'], ['rShoulder', 'rElbow'], ['rElbow', 'rWrist']],
          score: 0.21, active: false, harmonics: 0, maxHarmonics: 8,
          fit: { cx: 0.5104, cy: 0.2472, dx: 0.071, dy: -0.9975 } },
        { id: 'legs', label: 'Arti inferiori', color: '#FFB300', note: 'D4',
          segs: [['lAnkle', 'lKnee'], ['lKnee', 'lHip'], ['lHip', 'rHip'], ['rHip', 'rKnee'], ['rKnee', 'rAnkle']],
          score: 0.95, active: true, harmonics: 5, maxHarmonics: 8,
          fit: { cx: 0.51, cy: 0.6308, dx: 0.0, dy: 1.0 } }
    ]
};

// ?nessuno=1 toglie il corpo: e' il caso di chi apre il telefono prima di
// mettersi davanti alla webcam. La figura guida deve comparire lo stesso,
// centrata, altrimenti non si saprebbe che posa assumere per farsi vedere.
if (/(^|[?&])nessuno=1/.test(location.search)) { SNAP.body = null; }

var view = new window.SchermoView(document.getElementById('sky'));
var els = {
    asana: document.getElementById('asana'),
    chord: document.getElementById('chord'),
    step: document.getElementById('step'),
    cue: document.getElementById('cue'),
    notes: document.getElementById('notes')
};

function draw() {
    view.resize(window.innerWidth, window.innerHeight);
    view.render(SNAP, 0.4);
    view.text(SNAP, els);
}
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
